# Netlify detects Next.js and applies its Next.js runtime (OpenNext adapter) automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Demo: keep the whole site out of search engines (robots.txt + meta tags also say noindex).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
